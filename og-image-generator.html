<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Social preview image | Real World Electric</title>
  <style>
    body { max-width: 75rem; margin: auto; padding: 2rem 1rem; font-family: Arial, sans-serif; background: #f8f8f4; color: #20241f; }
    h1 { font-size: 1.5rem; }
    canvas { display: block; width: 100%; height: auto; border: 1px solid #cbd0c8; box-sizing: border-box; }
    button { margin-top: 1.25rem; padding: .75rem 1.25rem; border: 0; border-radius: .3rem; font: inherit; font-weight: 700; background: #20241f; color: white; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
  </style>
</head>
<body>
  <h1>Real World Electric social preview</h1>
  <canvas id="preview" width="1200" height="630" aria-label="Real World Electric. Residential electrical services in Calgary. EV charging, electrical planning and load calculations. realworldelectric.com."></canvas>
  <button type="button" id="download" disabled>Download 1200 × 630 PNG</button>
  <p id="status" role="status"></p>
  <script>
    function drawShareImage(canvas, logo) {
      const context = canvas.getContext('2d');
      const ink = '#20241f';
      const accent = '#f4cf53';
      const paper = '#f8f8f4';
      const fontFamily = '"Liberation Sans", Arial, sans-serif';
      const margin = 72;

      context.fillStyle = paper;
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.save();
      context.globalCompositeOperation = 'multiply';
      context.drawImage(logo, margin, 38, 100, 85);
      context.restore();

      context.fillStyle = ink;
      context.textBaseline = 'alphabetic';
      context.font = '700 40px ' + fontFamily;
      context.fillText('Real World Electric', 192, 98);

      context.fillStyle = '#cbd0c8';
      context.fillRect(margin, 154, 1056, 2);
      context.fillStyle = ink;
      context.font = '700 86px ' + fontFamily;
      context.fillText('Residential electrical', margin, 291);
      context.fillText('services in Calgary', margin, 387);
      context.font = '400 36px ' + fontFamily;
      context.fillText('EV charging  ·  Electrical planning  ·  Load calculations', margin, 468);

      context.fillRect(0, 526, canvas.width, 104);
      context.fillStyle = accent;
      context.fillRect(margin, 575, 36, 5);
      context.fillStyle = paper;
      context.font = '700 31px ' + fontFamily;
      context.fillText('realworldelectric.com', 130, 588);
    }

    const preview = document.getElementById('preview');
    const button = document.getElementById('download');
    const logo = new Image();
    logo.onload = () => {
      drawShareImage(preview, logo);
      button.disabled = false;
    };
    logo.onerror = () => {
      document.getElementById('status').textContent = 'The company logo could not be loaded. Reload this page to try again.';
    };
    logo.src = 'assets/rwe-logo.png';

    button.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'og-image.png';
      link.href = preview.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
