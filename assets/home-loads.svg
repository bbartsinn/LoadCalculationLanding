<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" fill="none">
  <title>Residential electrical loads</title>
  <desc>An illustrated home and secondary suite with a range, heat pump and electric vehicle connected to the electrical service. This is a planning illustration, not a wiring diagram.</desc>
  <style>
    /* Paired-path trace adapted from Magic UI Animated Beam; MIT license retained. */
    .service-trace { stroke-dasharray:420; stroke-dashoffset:420; animation:service-trace 2.5s ease-out .2s forwards; }
    @keyframes service-trace { to { stroke-dashoffset:0; } }
    @media (prefers-reduced-motion:reduce) { .service-trace { animation:none; stroke-dashoffset:0; } }
  </style>
  <defs>
    <linearGradient id="wall" x1="150" y1="140" x2="455" y2="350" gradientUnits="userSpaceOnUse"><stop stop-color="#fffdf5"/><stop offset="1" stop-color="#eceadd"/></linearGradient>
    <linearGradient id="roof" x1="160" y1="80" x2="410" y2="180" gradientUnits="userSpaceOnUse"><stop stop-color="#53634e"/><stop offset="1" stop-color="#2c392b"/></linearGradient>
    <linearGradient id="ground" x1="40" y1="350" x2="550" y2="390" gradientUnits="userSpaceOnUse"><stop stop-color="#e1e7d5"/><stop offset="1" stop-color="#f0f0e6"/></linearGradient>
    <pattern id="roofLines" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)"><path d="M0 0v18" stroke="#9eac8e" stroke-width="1" opacity=".3"/></pattern>
    <filter id="shadow" x="0" y="0" width="600" height="440" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <ellipse cx="313" cy="357" rx="232" ry="35" fill="#727c60" opacity=".1" filter="url(#shadow)"/>
